[package]
name = "easyop"
version = "0.41.15"
description = "easyop：按住说话/连续通话 → 云端流式识别 → 松手上屏 + EasyInput 开发板三通道通信（HID/Wi-Fi/蓝牙）"
authors = ["easyop"]
edition = "2021"

[lib]
name = "easyop_lib"
# 只留 rlib —— **不要加回 staticlib / cdylib**（2026-09-22 实测决定）。
#
# 那两项是 `create-tauri-app` 模板的默认值，服务的是**移动端**：Android/iOS 把
# Rust 编成 .so / .a 再被原生工程链进去。本项目只出 Windows 桌面版：
# `src/main.rs` 一句 `easyop_lib::run()`，链的是 **rlib**；staticlib / cdylib
# 编出来没人用。
#
# 代价不是"多两个文件"，而是**每轮编译都要多写约 1.1 GB 的 `easyop_lib.lib`**
# （静态库把整棵依赖树的 .o 合并进去，debug 信息还全带着）。开发期每次存盘
# 触发重编都写一遍，磁盘与 I/O 全是白耗。
#
# 何时需要加回来：`tauri android init` / `tauri ios init` 之后。桌面版不需要。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# ⚠️ 这不是功能依赖，是**编译期修复**，不要删。
#
# 问题链（实测 2026-09-22，rustc 1.98）：本 crate 的 build-dep `tauri-build`
# → `tauri-utils` → `schemars 0.8.22` → `indexmap 1.9.3`。
# indexmap 1.9 的 `IndexMap<K, V, S = RandomState>` **只在 `has_std` 生效时**才给 S
# 默认值；而 `has_std` 由它自己的 build.rs 用 autocfg 探测 sysroot 得出
# （`emit_sysroot_crate("std")`）。在 rustc 1.98 上这个探测**探不到** ——
# 证据是 `target/debug/build/indexmap-*/output` 里只有 `rustc-check-cfg`、没有
# `rustc-cfg=has_std`。于是 schemars 的 `pub type Map<K, V> = indexmap::IndexMap<K, V>`
# 报 `struct takes 3 generic arguments but 2 were supplied`，整个项目 `cargo check`
# 都过不去。
#
# indexmap 1.9 的 build.rs 第一句就是「If "std" is explicitly requested, don't bother
# probing」⇒ **显式开 std 即可跳过那次探测**。这条依赖的唯一作用就是提交那个特性。
#
# ⚠️ 必须挂在 `[build-dependencies]`、不能挂 `[dependencies]`：schemars 处在
# **构建依赖图（host）**里，而 Cargo resolver v2（edition 2021 默认）**不跨
# 宿主图与目标图合并特性** —— 挂到 `[dependencies]` 实测无效，报同一个错。
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 豆包 TTS 的音频片段是 base64（NDJSON 每行的 data 字段）。
#
# 为什么直接依赖而不是像 WAV 那样手写：**0.22.1 早已在依赖树里被编译过**
# （reqwest/tokio-tungstenite 都在用，target/debug/deps 下已有 rlib），
# 所以这一行不新增任何下载与编译。手写 base64 反而要多维护"填充缺失/空白字符"
# 这些边界，得不偿失。
base64 = "0.22"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_Shell",
    "Win32_System_WindowsProgramming",
    # ⌘SS 面板的「资源管理器右键菜单」用到 SHCreateItemFromParsingName /
    # IShellItem::BindToHandler / IContextMenu，这些 API 由本特性开关控制。
    "Win32_System_Com",
    "Win32_System_Registry",
    # 截图小程序用 GDI 抓屏（BitBlt / CreateDIBSection），见 screenshot.rs。
    "Win32_Graphics_Gdi",
] }
# 云端流式识别相关
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
http = "1"
cpal = "0.15"
uuid = { version = "1", features = ["v4", "v5"] }
flate2 = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# ============================================================================
# [patch] tao：修一个上游未修的 UB（2026-09-30）
# ============================================================================
#
# 症状：同时跑两条任务台任务时，进程**无任何业务报错直接闪退**（退出码 0xc0000409，
#       WER 记为 BEX64），日志里只有一行
#       `unsafe precondition(s) violated: hint::assert_unchecked ...`。
#
# 根因（有完整回溯，见 .workbuddy/forensics/2026-09-30-rc-abort.md）：
#   tao 的 Windows 事件循环 runner 是 `Rc<EventLoopRunner<T>>`（**计数非原子**），
#   它被包在 `EventLoopWindowTarget` 里，而该类型经 Tauri 一路走到
#   `AppHandle::clone()`（tauri-2.11.5/src/app.rs:481 -> WryHandle -> Context
#   -> DispatcherMainThreadContext -> window_target）。偏偏 `AppHandle` 是
#   `Send + Sync + Clone`，官方推荐用法就是"进线程/异步块前先 clone 一个"。
#   => 多个线程同时 clone/drop `AppHandle` 会**并发读改写同一个非原子计数**，
#      计数被写坏到 0；下一次 `Rc::clone` 命中 `assert_unchecked(strong != 0)`
#      的 UB 检查 => `panic_nounwind` => **不 unwinding，直接 abort**（进程消失）。
#
# 为什么不在自己代码里"别跨线程 clone"绕开（试过一次，会换地方再冒）：
#   2026-09-23 崩的是同一个病的另一个出口（`tauri::tray::TrayIcon` 里 tray-icon 的
#   `Rc`，当时改成全局托盘监听器绕过去了）；这次换成了 tao 这条链。全项目还有
#   29 处 `AppHandle::clone` + 34 处 `get_webview_window`（后者内部也会 clone 一个
#   `AppHandle`，见 tauri-2.11.5/src/manager/mod.rs:671 的 `.cloned()`）。
#   "堵出口"是打地鼠，且每处都要人工判断调用点跑在哪个线程上。要堵的是**那个计数器**。
#
# 改动（tao 0.35.3 起共 2 处，均带 `[easyop patch]` 标记）：
#   src/platform_impl/windows/event_loop/runner.rs : Rc<...> -> Arc<...>（别名）
#   src/platform_impl/windows/event_loop.rs        : Rc::new(...) -> Arc::new(...)
#   自动 trait 不变：`EventLoopRunner<T>` 内部是 Cell/RefCell，本来就 `!Send + !Sync`，
#   所以 `Arc<EventLoopRunner<T>>` 与 `Rc<...>` 同为 `!Send + !Sync`，
#   只是计数由非原子变原子 —— 只消除竞态，不改任何行为。
#
# ⚠️ 何时可以删掉这一节：
#   tao 上游把 `EventLoopRunnerShared` 改成 Arc/原子计数之后（2026-09-30 查其 dev 分支
#   仍是 `Rc`；相关问题 tauri-apps/tauri#10001 自 2024 年起开着）。
#   删法：删本节 + `rm -rf vendor/tao`，并重跑"并发 clone 压测"确认（见上面 forensics 文档）。
#
# ⚠️ 有意接受的代价：vendor 里的 tao 被冻结在 0.35.3，不再跟随上游。
#   若将来 tauri 要求 tao ^0.36，cargo 会报错（不会静默），届时重新 vendor 新版并把这
#   两处改动照做一遍即可。
[patch.crates-io]
tao = { path = "vendor/tao" }
