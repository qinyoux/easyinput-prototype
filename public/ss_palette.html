          var out = document.createElement("div");
          out.className = "mini-calc-out";
          var value = document.createElement("div");
          value.className = "mini-calc-value";
          out.appendChild(value);
          bodyEl.appendChild(out);

          var current = ""; // 当前可复制的答案

          function update() {
            var raw = trim(input.value);
            if (!raw) {
              value.className = "mini-calc-value";
              value.textContent = "0";
              current = "0";
              copyBtn.disabled = false;
              return;
            }
            var v;
            try {
              v = calcEval(raw);
            } catch (err) {
              v = null;
              value.className = "mini-calc-value err";
              value.textContent = (err && err.message) || "算式无法计算";
              current = "";
              copyBtn.disabled = true;
              return;
            }
            if (v === null) {
              // calcEval 返回 null 表示「有非法字符」，与抛异常是两种不同的错
              value.className = "mini-calc-value err";
              value.textContent = "只支持 + - * / % ^ 和括号";
              current = "";
              copyBtn.disabled = true;
              return;
            }
            value.className = "mini-calc-value";
            value.textContent = formatNumber(v);
            current = value.textContent;
            copyBtn.disabled = false;
          }

          function copyResult() {
            if (!current) {
              setMiniHint("算式还不对，先改一下吧", "err");
              return;
            }
            miniCopy(current, "结果已复制");
          }

          miniOnEnter(input, copyResult);
          copyBtn.addEventListener("click", copyResult);
          input.addEventListener("input", update);

          input.value = trim(payload);
          update();
          input.focus();
        };

        // ---------- 内置工具：待办清单 ----------

        var TODO_STORAGE_KEY = "easyop.miniapp.todos";

        function loadTodos() {
          try {
            var raw = localStorage.getItem(TODO_STORAGE_KEY);
            var list = raw ? JSON.parse(raw) : [];
            return Object.prototype.toString.call(list) === "[object Array]" ? list : [];
          } catch (err) {
            return [];
          }
        }

        function saveTodos(list) {
          try {
            localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(list));
          } catch (err) {
            setMiniHint("保存失败：本地存储不可用", "err");
          }
        }

        MINI_APP_RENDERERS.todo = function (bodyEl) {
          var todos = loadTodos();

          var input = miniInput("记一笔，回车添加");
          var addBtn = miniButton("添加");
          bodyEl.appendChild(miniRow(input, addBtn));

          var list = document.createElement("div");
          list.className = "mini-list";
          bodyEl.appendChild(list);

          function renderList() {
            list.textContent = "";
            if (todos.length === 0) {
              list.appendChild(miniPlaceholder("还没有待办。上面输入内容按回车就能加一条。"));
              return;
            }
            todos.forEach(function (item, index) {
              var row = document.createElement("div");
              row.className = "mini-todo" + (item.done ? " done" : "");

              var check = document.createElement("div");
              check.className = "mini-todo-check";
              check.textContent = "✓";
              check.title = item.done ? "标记为未完成" : "标记为已完成";
              check.addEventListener("click", function () {
                item.done = !item.done;
                saveTodos(todos);
                renderList();
              });

              var text = document.createElement("div");
              text.className = "mini-todo-text";
              text.textContent = item.text;
              text.title = item.text;

              var del = document.createElement("div");
              del.className = "mini-todo-del";
              del.textContent = "✕";
              del.title = "删除";
              del.addEventListener("click", function () {
                todos.splice(index, 1);
                saveTodos(todos);
                renderList();
                adjustWindowHeight();
              });

              row.appendChild(check);
              row.appendChild(text);
              row.appendChild(del);
              list.appendChild(row);
            });
          }

          function add() {
            var v = trim(input.value);
            if (!v) return;
            todos.push({ text: v, done: false });
            input.value = "";
            saveTodos(todos);
            renderList();
            setMiniHint("已添加", "ok");
            adjustWindowHeight();
          }

          miniOnEnter(input, add);
          addBtn.addEventListener("click", add);
          renderList();
          input.focus();
        };

        // ---------- 内置工具：截图 ----------

        MINI_APP_RENDERERS.screenshot = function (bodyEl) {
          var shootBtn = miniButton("立即截图");
          var copyBtn = miniButton("复制路径", true);
          copyBtn.disabled = true;
          bodyEl.appendChild(
            miniRow(shootBtn, copyBtn, miniNote("抓取整个屏幕，PNG 存到图片文件夹的 easyop 目录。"))
          );

          var pathBox = miniPlaceholder("还没有截图。");
          bodyEl.appendChild(pathBox);

          var savedPath = "";

          function capture() {
            if (!invoke) {
              setMiniHint("截图失败：接口不可用", "err");
              return;
            }
            shootBtn.disabled = true;
            shootBtn.textContent = "抓取中…";
            setMiniHint("面板会闪一下，马上回来", "");

            invoke("ss_capture_screen")
              .then(function (path) {
                savedPath = String(path || "");
                if (savedPath) {
                  pathBox.className = "mini-path";
                  pathBox.textContent = savedPath;
                  copyBtn.disabled = false;
                  setMiniHint("已保存", "ok");
                } else {
                  setMiniHint("截图失败：没有拿到文件路径", "err");
                }
                adjustWindowHeight();
              })
              .catch(function (err) {
                setMiniHint("截图失败：" + (err && err.message ? err.message : err), "err");
              })
              .then(function () {
                // 无论成败都要把按钮恢复，否则失败一次就再也点不动了
                shootBtn.disabled = false;
                shootBtn.textContent = savedPath ? "再截一张" : "立即截图";
              });
          }

          shootBtn.addEventListener("click", capture);
          copyBtn.addEventListener("click", function () {
            miniCopy(savedPath, "路径已复制");
          });
        };

        // ---------- 内置工具：翻译 ----------

        // 语言方向。走「打开在线翻译页面」而不是调 API：不需要 key、不引入新依赖，
        // 翻译质量也是现成的（与 deep-dive 里「面板内输入 翻 你好 → 显示英文」的意图一致）。
        var TRANSLATE_DIRS = [
          { label: "中 → 英", from: "zh-Hans", to: "en" },
          { label: "英 → 中", from: "en", to: "zh-Hans" },
          { label: "中 → 日", from: "zh-Hans", to: "ja" },
          { label: "中 → 韩", from: "zh-Hans", to: "ko" },
          { label: "自动 → 英", from: "auto-detect", to: "en" }
        ];

        MINI_APP_RENDERERS.translate = function (bodyEl, payload) {
          var input = miniInput("输入要翻译的内容，回车打开在线翻译");
          var goBtn = miniButton("翻译");
          bodyEl.appendChild(miniRow(input, goBtn));

          var dirs = document.createElement("div");
          dirs.className = "mini-dirs";
          bodyEl.appendChild(dirs);

          var dirIndex = 0;

          function renderDirs() {
            dirs.textContent = "";
            TRANSLATE_DIRS.forEach(function (dir, i) {
              var chip = document.createElement("button");
              chip.type = "button";
              chip.className = "mini-chip" + (i === dirIndex ? " on" : "");
              chip.textContent = dir.label;
              chip.addEventListener("click", function () {
                dirIndex = i;
                renderDirs();
              });
              dirs.appendChild(chip);
            });
          }

          function go() {
            var text = trim(input.value);
            if (!text) {
              setMiniHint("先输入要翻译的内容", "err");
              input.focus();
              return;
            }
            if (!invoke) {
              setMiniHint("打开失败：接口不可用", "err");
              return;
            }
            var dir = TRANSLATE_DIRS[dirIndex];
            var url =
              "https://www.bing.com/translator?ref=TThis" +
              "&from=" + encodeURIComponent(dir.from) +
              "&to=" + encodeURIComponent(dir.to) +
              "&text=" + encodeURIComponent(text);
            // kind 用 "url"：后端确认后交给系统默认浏览器打开，面板随即收起
            invoke("ss_execute", { kind: "url", target: url, title: text })
              .then(function () {
                hidePalette();
              })
              .catch(function (err) {
                setMiniHint("打开失败：" + (err && err.message ? err.message : err), "err");
              });
          }

          miniOnEnter(input, go);
          goBtn.addEventListener("click", go);
          renderDirs();
          input.value = trim(payload);
          input.focus();
        };

        // ---------- 面板显隐 ----------

        function hidePalette() {
          if (invoke) {
            invoke("hide_ss_palette").catch(function () {});
          }
        }

        // 从后端重新读取「精简右键菜单」开关。
        // 面板窗口在应用启动时就创建并常驻，页面不会随设置改动重新加载，
        // 所以每次唤出面板都要重新拉一次，否则会一直用启动时的旧值。
        function refreshCompactMenuSetting() {
          if (!invoke) return;
          invoke("get_compact_context_menu")
            .then(function (v) {
              state.compactContextMenu = !!v;
            })
            .catch(function () { /* 忽略，默认 false */ });
        }

        function showPalette() {
          // 上次可能是停在内置工具里被收起的，先退回搜索视图再重置其余状态
          resetMiniAppView();
          searchInput.value = "";
          state.results = [];
          state.cursor = 0;
          state.query = "";
          state.lastExecuteAt = 0;
          state.enterHeld = false;
          state.contextMenuIndex = -1;
          // 上一次点图标的启动意图到此为止：新一次唤出要能立刻再点
          state.launching = false;
          hideCompactMenu();
          refreshCompactMenuSetting();
          // 图标区每次唤出都重新读一次：小程序管理页里刚加进来的项要能立刻出现在搜索框下面
          refreshMiniApps();
          clearTimeout(state.enterResetTimer);
          render();
          searchInput.focus();
        }

        // ---------- 事件监听 ----------

        searchInput.addEventListener("input", function (e) {
          triggerSearch(e.target.value);
        });

        document.addEventListener("keydown", function (e) {
          switch (e.key) {
            case "ArrowUp":
              // 内置工具视图里不接管方向键，交给工具自己的输入框 / 列表滚动
              if (state.miniapp) break;
              e.preventDefault();
              moveCursor(-1);
              break;
            case "ArrowDown":
              if (state.miniapp) break;
              e.preventDefault();
              moveCursor(1);
              break;
            case "Enter":
              // 内置工具内按回车由渲染器自己在输入框上处理（stopPropagation 拦在前面），
              // 真走到这里说明焦点在工具容器上，忽略即可 —— 绝不能去执行背后的搜索结果。
              if (state.miniapp) break;
              // 输入法正在拼字时，回车的语义是“候选上屏”而不是“打开文件”，必须放行给输入法。
              // isComposing 是标准字段；keyCode 229 是 WebView2 在 IME 接管按键时的兜底特征。
              if (e.isComposing || e.keyCode === 229) break;
              e.preventDefault();
              // 长按回车会连续派发 keydown，用“按住标记”保证一次按下只执行一次。
              // 这里不能用 e.repeat 判断：部分输入来源（自动化/快捷键注入）会把它恒置为 true，会导致回车完全失灵。
              if (state.enterHeld) break;
              state.enterHeld = true;
              clearTimeout(state.enterResetTimer);
              state.enterResetTimer = setTimeout(function () {
                state.enterHeld = false;
              }, 800);
              executeCurrent();
              break;
            case "Escape":
              e.preventDefault();
              // 优先级：内置工具 → 精简菜单 → 收面板
              if (closeMiniApp()) {
                // 已在工具里，退回搜索视图
              } else if (compactMenuEl && !compactMenuEl.classList.contains("hidden")) {
                hideCompactMenu();
              } else {
                hidePalette();
              }
              break;
            default:
              break;
          }
        });

        // 松开回车立即解除“按住”标记，保证连续两次正常按键都能生效
        document.addEventListener("keyup", function (e) {
          if (e.key === "Enter") {
            clearTimeout(state.enterResetTimer);
            state.enterHeld = false;
          }
        });

        function listen(name, handler) {
          if (tauri.event && tauri.event.listen) {
            // 监听注册是核心插件命令，受权限约束。失败必须显式暴露，
            // 否则会静默失效（表现为「后端发了事件，前端却毫无反应」）。
            Promise.resolve(tauri.event.listen(name, handler)).catch(function (err) {
              console.error("[ss_palette] 事件监听注册失败: " + name, err);
            });
          } else {
            console.warn("[ss_palette] 事件 API 不可用，事件监听被跳过: " + name);
          }
        }

        listen("ss-palette-show", function () {
          showPalette();
        });

        window.addEventListener("focus", function () {
          setTimeout(function () {
            // 内置工具模式下搜索框是隐藏的（focus() 对隐藏元素无效），
            // 此时焦点要交给工具自己的输入控件，否则用户打字会「打不进去」。
            if (state.miniapp) {
              var miniInput = miniappBodyEl && miniappBodyEl.querySelector(".mini-input");
              if (miniInput) miniInput.focus();
              return;
            }
            searchInput.focus();
          }, 50);
          // 兜底：面板每次唤出都会重新获得焦点，这里再同步一次后端设置，
          // 保证即使没收到 ss-palette-show 事件，开关状态也不会过期。
          refreshCompactMenuSetting();
          // 同理：图标区也不能因为少收一个事件就永远空着
          refreshMiniApps();
        });

        // ---------- 精简右键菜单事件绑定 ----------
        if (compactMenuEl) {
          // 菜单项点击
          var items = compactMenuEl.querySelectorAll(".compact-menu-item");
          for (var i = 0; i < items.length; i++) {
            (function (el) {
              el.addEventListener("click", function () {
                var action = el.getAttribute("data-action");
                handleCompactMenuAction(action);
              });
            })(items[i]);
          }
          // 点击菜单项外 → 收起
          document.addEventListener("mousedown", function (e) {
            if (!compactMenuEl.classList.contains("hidden") &&
                !compactMenuEl.contains(e.target)) {
              hideCompactMenu();
            }
          });
        }

        // ---------- 初始化 ----------
        // 加载「精简右键菜单」设置（之后每次唤出面板会再刷新一次）
        refreshCompactMenuSetting();
        render();
        searchInput.focus();
      })();
    </script>
  </body>
</html>
