<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>easyop 语音编辑</title>
    <style>
      :root {
        --panel: rgba(12, 10, 18, 0.82);
        --panel-edge: rgba(255, 255, 255, 0.14);
        --ink: #ffffff;
        --ink-dim: rgba(255, 255, 255, 0.5);
        --ink-acc: #cdb3ff;
        --accent: #8f6bff;
        --accent-green: #4ade80;
        --accent-amber: #fbbf24;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 8px;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      .panel {
        position: relative;
        z-index: 2;
        width: 100%;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5), inset 0 0 16px rgba(143, 107, 255, 0.12);
        backdrop-filter: blur(4px);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        letter-spacing: 0.04em;
        color: var(--ink-acc);
        margin-bottom: 4px;
      }
      .status::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        animation: pulse 1.3s ease-in-out infinite;
        flex-shrink: 0;
      }
      .status.done::before { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); animation: none; }
      .status.error::before { background: var(--accent-amber); box-shadow: 0 0 8px var(--accent-amber); animation: none; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.82); }
      }

      .selected-text {
        font-size: 11px;
        color: var(--ink-dim);
        line-height: 1.3;
        margin-bottom: 4px;
        max-height: 28px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .selected-text .label { color: var(--ink-acc); margin-right: 4px; }

      .text {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.3;
        color: var(--ink);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 48px;
        overflow: hidden;
      }
      .text .cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        margin-left: 2px;
        vertical-align: -0.14em;
        background: #ffffff;
        animation: blink 1s steps(2) infinite;
      }
      @keyframes blink { 50% { opacity: 0; } }

      .text.placeholder {
        font-weight: 500;
        font-size: 12px;
        color: var(--ink-dim);
        text-shadow: none;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="panel">
        <div class="status" id="status">等待编辑…</div>
        <div class="selected-text" id="selected" style="display:none"><span class="label">原文：</span><span id="selected-content"></span></div>
        <div class="text placeholder" id="text">选中文本后按编辑键，说出修改要求</div>
      </div>
    </div>

    <script>
      (function () {
        var textEl = document.getElementById("text");
        var statusEl = document.getElementById("status");
        var selectedEl = document.getElementById("selected");
        var selectedContentEl = document.getElementById("selected-content");

        var llmText = "";

        function setText(payload) {
          textEl.classList.remove("placeholder");
          textEl.textContent = payload;
        }

        function appendLlmChunk(chunk) {
          if (llmText === "") {
            textEl.classList.remove("placeholder");
          }
          llmText += chunk;
          textEl.innerHTML = llmText + '<span class="cursor"></span>';
        }

        function reset() {
          llmText = "";
          textEl.classList.add("placeholder");
          textEl.textContent = "选中文本后按编辑键，说出修改要求";
          selectedEl.style.display = "none";
          statusEl.className = "status";
          statusEl.textContent = "等待编辑…";
        }

        var tauri = window.__TAURI__;
        if (tauri && tauri.event && tauri.event.listen) {
          tauri.event.listen("edit-state", function (e) {
            var s = e.payload || "";
            // 编辑开始时重置全部状态，清除上次残留的 llmText / 字幕
            if (/聆听/.test(s)) {
              reset();
            }
            statusEl.textContent = s;
            statusEl.className = "status";
            if (/完成/.test(s)) statusEl.classList.add("done");
            else if (/失败|错误|不可用/.test(s)) statusEl.classList.add("error");
          });

          tauri.event.listen("edit-partial", function (e) {
            setText(e.payload);
          });

          tauri.event.listen("edit-selected", function (e) {
            var s = e.payload || "";
            if (s) {
              selectedContentEl.textContent = s.length > 60 ? s.slice(0, 60) + "…" : s;
              selectedEl.style.display = "block";
            }
          });

          tauri.event.listen("edit-llm-chunk", function (e) {
            appendLlmChunk(e.payload);
          });

          tauri.event.listen("edit-done", function (e) {
            var r = e.payload;
            if (r && r.modified) {
              textEl.innerHTML = r.modified;
            }
            statusEl.textContent = "编辑完成";
            statusEl.className = "status done";
          });

          tauri.event.listen("asr-state", function (e) {
            var s = e.payload || "";
            if (/正在听|聆听/.test(s)) {
              statusEl.textContent = "正在听修改要求…";
              statusEl.className = "status";
              llmText = "";
            }
          });

          tauri.event.listen("asr-partial", function (e) {
            setText(e.payload);
          });
        }
      })();
    </script>
  </body>
</html>
